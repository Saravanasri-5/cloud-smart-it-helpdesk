name: Helpdesk CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python files
        run: |
          python -m compileall \
            app.py \
            config.py \
            extensions.py \
            models.py \
            routes \
            services.py \
            utils.py

      - name: Create deployment package
         run: |
           git archive --format=tar.gz --output=release.tgz HEAD

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Upload package to S3
        run: |
          aws s3 cp release.tgz \
            s3://cloud-smart-it-helpdesk-attachments-2026/deploy/${GITHUB_SHA}.tgz

      - name: Create deployment parameters
        run: |
          cat > ssm-params.json <<EOF
          {
            "commands": [
              "set -e",
              "aws s3 cp s3://cloud-smart-it-helpdesk-attachments-2026/deploy/${GITHUB_SHA}.tgz /tmp/helpdesk-release.tgz",
              "rm -rf /tmp/helpdesk-deploy",
              "mkdir -p /tmp/helpdesk-deploy",
              "tar -xzf /tmp/helpdesk-release.tgz -C /tmp/helpdesk-deploy",
              "sudo -u ec2-user -H python3 -m pip install --user -r /tmp/helpdesk-deploy/requirements.txt",
              "sudo systemctl stop helpdesk",
              "cp -a /tmp/helpdesk-deploy/. /home/ec2-user/cloud-smart-it-helpdesk/",
              "sudo chown -R ec2-user:ec2-user /home/ec2-user/cloud-smart-it-helpdesk",
              "sudo systemctl restart helpdesk",
              "sleep 5",
              "sudo systemctl is-active --quiet helpdesk",
              "curl -fsS http://127.0.0.1/login >/dev/null"
            ]
          }
          EOF

      - name: Deploy to Auto Scaling instances
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:aws:autoscaling:groupName,Values=helpdesk-asg" \
            --parameters "file://ssm-params.json" \
            --comment "Deploy ${GITHUB_SHA}" \
            --timeout-seconds 600 \
            --max-concurrency "100%" \
            --max-errors "0" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:aws:autoscaling:groupName,Values=helpdesk-asg" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "Waiting for deployment on $INSTANCE_ID"

            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"
          done

          echo "Deployment completed successfully"